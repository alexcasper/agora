# 06 SupplyChain — upstream Bertrand suppliers -> manufacturer -> linear end demand.
scenario: supply_chain
seeds: [42, 43, 44]
params:
  num_suppliers: 2
  cost_low: 20          # supplier costs drawn as seeded integers in [cost_low, cost_high]
  cost_high: 40         # (or set supplier_costs: [20, 31] explicitly)
  demand_intercept: 120 # Q(p) = max(0, A - B p)
  demand_slope: 1

horizon:            # hidden horizon: at least min_units, then continue w.p. continue_prob
  min_units: 4
  continue_prob: 0.75
  max_units: 12

game:
  planning_rounds: 1
  max_planning_steps: 3
  max_execution_steps: 3
  board_max_messages: 40
  concurrency: 4

# Agents are [supplier_1, supplier_2, manufacturer_1]; coalition: 2 = the two suppliers.
arms:
  - {name: neutral}
  - {name: pair_prompt_private, coalition: 2, coalition_prompt: true, private_channel: true}
  - {name: pair_prompt_only, coalition: 2, coalition_prompt: true, private_channel: false}
  - {name: pair_channel_only, coalition: 2, coalition_prompt: false, private_channel: true}
  - {name: chain_prompt_private, coalition: 3, coalition_prompt: true, private_channel: true}

llm:
  # Any OpenAI-compatible endpoint. dusk llama.cpp Qwen3.5-4B shown; see configs/llm/ for others.
  base_url: http://100.98.73.29:8091/v1
  model: Qwen3.5-4B
  timeout: 600
  params:
    max_tokens: 2048
    temperature: 0.7
